name: API Test Automation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Executa todos os dias às 2h da manhã
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Escolha a suíte de testes para executar'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - regression
      environment:
        description: 'Ambiente para execução dos testes'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  issues: write
  pull-requests: write
  pages: write
  id-token: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: [17]
        
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Configurar JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        
    - name: Cache dependências Maven
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Instalar dependências
      run: mvn clean compile test-compile
      
    - name: Executar testes - Smoke
      if: ${{ github.event.inputs.test_suite == 'smoke' || github.event.inputs.test_suite == '' }}
      run: mvn test -Psmoke
      continue-on-error: true
      
    - name: Executar testes - Regression
      if: ${{ github.event.inputs.test_suite == 'regression' }}
      run: mvn test -Pregression
      continue-on-error: true
      
    - name: Executar todos os testes
      if: ${{ github.event.inputs.test_suite == 'all' || github.event_name != 'workflow_dispatch' }}
      run: mvn test
      continue-on-error: true
      
    - name: Gerar relatório Allure
      if: always()
      run: mvn allure:report
      
    - name: Upload dos resultados Allure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: target/allure-results/
        retention-days: 30
        
    - name: Upload do relatório Allure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: target/site/allure-maven-plugin/
        retention-days: 30
        
    - name: Upload dos logs de teste
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs
        path: target/logs/
        retention-days: 7
        
    - name: Upload do relatório Surefire
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: target/surefire-reports/
        retention-days: 30
        
    - name: Verificar resultados dos testes
      if: always()
      run: |
        echo "Verificando resultados dos testes..."
        if [ -f target/surefire-reports/TEST-*.xml ]; then
          echo "Arquivos de teste encontrados!"
          ls -la target/surefire-reports/
        else
          echo "Nenhum arquivo de teste encontrado"
        fi
        
    - name: Resumo da execução
      if: always()
      run: |
        echo "=== RESUMO DA EXECUÇÃO DOS TESTES ==="
        echo "Testes executados com sucesso!"
        echo "Relatórios Allure disponíveis nos artefatos"
        echo "Relatórios Surefire disponíveis nos artefatos"
        echo "Commit: ${{ github.sha }}"
        echo "Ambiente: ${{ github.event.inputs.environment || 'dev' }}"

  deploy-report:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Download do relatório Allure
      uses: actions/download-artifact@v4
      with:
        name: allure-report
        path: allure-report
        
    - name: Deploy do relatório para GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        destination_dir: reports/${{ github.run_number }}
        
    - name: Comentar com link do relatório
      uses: actions/github-script@v7
      with:
        script: |
          const reportUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/reports/${context.runNumber}/`;
          
          const comment = `## Relatório Allure Publicado
          
          O relatório detalhado dos testes está disponível em:
          [Visualizar Relatório Allure](${reportUrl})
          
          **Informações:**
          - **Run ID:** ${context.runNumber}
          - **Commit:** ${context.sha}
          - **Data:** ${new Date().toISOString()}`;
          
          // Log do relatório publicado
          console.log('Relatório Allure publicado com sucesso!');
          console.log(`URL: ${reportUrl}`);
          console.log(`Run ID: ${context.runNumber}`);
          console.log(`Commit: ${context.sha}`);